<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>IKYNDO · abierta en otra pestaña</title>
    <!-- A esta página pasa una pestaña de la app cuando otra le pide los datos («Usar aquí», src/lib/database-turn.ts).
         Sin JavaScript: al salir de la app, esta pestaña suelta la base de datos. -->
    <style>
      html, body { margin: 0; height: 100%; background: #ffffff; }
      body {
        display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #121513; text-align: center;
      }
      main { max-width: 420px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
      img { width: 72px; height: 72px; border-radius: 18px; }
      h1 { margin: 6px 0 0; font-size: 22px; font-weight: 600; letter-spacing: -0.3px; }
      p { margin: 0; color: #545a56; font-size: 15px; line-height: 1.5; }
      a {
        margin-top: 8px; display: inline-flex; align-items: center; justify-content: center; height: 48px; padding: 0 22px;
        border-radius: 12px; background: #1d6b45; color: #ffffff; font-weight: 600; font-size: 15px; text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="icons/icon-192.png" alt="" />
      <h1>IKYNDO se ha abierto en otra pestaña</h1>
      <p>Tus datos solo pueden estar abiertos en una pestaña a la vez, así que esta los ha soltado. Puedes cerrarla.</p>
      <a href="./">Volver a usarla aquí</a>
    </main>
  </body>
</html>
