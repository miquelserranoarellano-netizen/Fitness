<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>
    <!-- Versión de prueba: que no aparezca en buscadores. -->
    <meta name="robots" content="noindex, nofollow" />
    <!-- Para añadirla a la pantalla de inicio (en el iPhone así Safari no borra los datos). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Fitness Coach" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- Estilos base de react-native-web: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        background-color: #ffffff;
      }
      body {
        overflow: hidden;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>Hace falta activar JavaScript para usar esta app.</noscript>
    <div id="root"></div>
  </body>
</html>
